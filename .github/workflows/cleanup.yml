name: Cleanup GHCR
on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  packages: write

jobs:
  cleanup:
    name: Cleanup GHCR
    runs-on: ubuntu-26.04
    steps:
      - name: Cleanup GHCR
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # ratchet:dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: docker-base-ci-test,docker-dev-ci-test
          older-than: 1 day

name: Lint Dockerfile
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Shopwell registry namespaces
        shell: bash
        run: |
          set -euo pipefail

          forbidden=(
            'shopwell/docker-base'
            'docker.io/shopwell/'
            'ghcr.io/shopwell8/'
            'ghcr.io/shopwell/'
          )

          for reference in "${forbidden[@]}"; do
            if rg --hidden \
              --glob '!.git/**' \
              --glob '!AGENTS.md' \
              --glob '!NOTICE' \
              --fixed-strings "$reference" .; then
              echo "Forbidden container registry reference: $reference"
              echo "Use shopwell8/* on Docker Hub or ghcr.io/shopwell-shop/* on GHCR."
              exit 1
            fi
          done

      - name: Lint FPM
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ./fpm/Dockerfile
          # Named BuildKit contexts cannot be tagged in the Dockerfile. Alpine packages
          # intentionally follow the base-image repository and the public installer
          # password is a configurable default, not a secret. The image's www-data name
          # must remain aligned with the official PHP base image.
          ignore: DL3006,DL3018,DL3064,DL3066

      - name: Lint Caddy
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ./caddy/Dockerfile
          # The base is supplied as a versioned BuildKit named context, and www-data
          # deliberately matches the user from the FPM image.
          ignore: DL3006,DL3018,DL3066
